<style>
/* ============================================================
   SHARED FOUNDATION — brand tokens taken from the live site
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #111; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; }

:root {
  --wine:       #9c2426;
  --wine-deep:  #6e1517;

  --gold:       #c9973a;

}

/* Scroll reveal — transform + opacity only */
.reveal { opacity: 0; transform: translateY(18px); }
.reveal.in {
  opacity: 1; transform: none;
  transition: opacity 460ms var(--ease), transform 460ms var(--ease);
}

/* Hero entrance — replayable via R */
.rise {
  opacity: 0; transform: translateY(22px);
  animation: rise 640ms var(--ease) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes rise { to { opacity: 1; transform: none; } }

.kb { animation: kb 16s var(--ease) forwards; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }

  .rise { opacity: 1 !important; transform: none !important; animation: none !important; }
  .kb { animation: none !important; }
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ============================================================
   THE PICKER — harness chrome, spec-verbatim, do not restyle
   ============================================================ */
.proto-picker {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 999px; background: rgba(10, 10, 10, 0.82);

  backdrop-filter: blur(12px) saturate(1.4);

  user-select: none; -webkit-user-select: none;
}

  transition: transform 250ms cubic-bezier(.23,1,.32,1), width 250ms cubic-bezier(.23,1,.32,1);

}
.proto-picker-item {
  position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;

}

.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255,255,255,.12); }

/* ============================================================
   VARIANT 1 — CELLAR
   Axis: dark, cinematic, product-led. Evening destination.
   ============================================================ */
.v-cellar { background: var(--charcoal); color: #efe3dd; font-family: 'Inter', sans-serif; padding-bottom: 0; }
.v-cellar .wrap { max-width: 1240px; margin: 0 auto; padding: 0 34px; }

}

.v-cellar .nav {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;

}

.v-cellar .hero { position: relative; height: 100vh; min-height: 640px; overflow: hidden; }

.v-cellar .hero-body {

  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
}
.v-cellar .hero-body h1 { font-size: clamp(44px, 6.4vw, 92px); line-height: 1.02; margin: 22px 0 0; max-width: 15ch; }

.v-cellar .btn-gold {

}
.v-cellar .btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); }
.v-cellar .btn-ghost {

  transition: border-color 180ms ease-out, transform 180ms var(--ease);
}
.v-cellar .btn-ghost:hover { border-color: var(--gold); transform: translateY(-2px); }

.v-cellar .stats { border-top: 1px solid rgba(201,151,58,.22); border-bottom: 1px solid rgba(201,151,58,.22); }
.v-cellar .stats-inner { display: grid; grid-template-columns: repeat(4, 1fr); }

.v-cellar .stat:last-child { border-right: 0; }
.v-cellar .stat b { display: block; font-family: 'Playfair Display', serif; font-size: 40px; color: var(--gold-light); font-weight: 400; }
.v-cellar .stat span { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); }

.v-cellar .sec { padding: 80px 0; }
/* Two-column head so the right half is never dead space. */
.v-cellar .sec-head {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 60px; align-items: end;
  margin-bottom: 50px; padding-bottom: 28px; border-bottom: 1px solid rgba(201,151,58,.2);

.v-cellar .bottle {

  transition: transform 220ms var(--ease), border-color 220ms ease-out;
}
.v-cellar .bottle:hover { transform: translateY(-6px); border-color: rgba(201,151,58,.5); }
.v-cellar .bottle img { width: 100%; height: 320px; object-fit: cover; object-position: center 30%; }
.v-cellar .bottle-body { padding: 22px 22px 26px; }
.v-cellar .bottle-body h3 { font-size: 21px; }
.v-cellar .bottle-body span { display: block; margin-top: 9px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }

.v-cellar .split { display: grid; grid-template-columns: 1.05fr .95fr; gap: 68px; align-items: center; }
.v-cellar .split img { width: 100%; height: 470px; object-fit: cover; border-radius: 2px; }

.v-cellar .edit-grid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 22px; }
.v-cellar .edit-col { display: grid; gap: 22px; }
.v-cellar .fig { position: relative; overflow: hidden; border-radius: 2px; }
.v-cellar .fig img { width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease); }
.v-cellar .fig:hover img { transform: scale(1.04); }
.v-cellar .fig-tall img { height: 620px; }
.v-cellar .fig-short img { height: 299px; }
.v-cellar .fig-cap {

}
.v-cellar .fig-cap h3 { font-size: 25px; }
.v-cellar .fig-cap p { margin: 7px 0 0; font-size: 13px; color: rgba(255,255,255,.66); font-weight: 300; }

.v-cellar .band { position: relative; height: 520px; overflow: hidden; }
.v-cellar .band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 55%; }
.v-cellar .band::after { content: ''; position: absolute; inset: 0; background: rgba(12,6,6,.62); }
.v-cellar .band-body {

}
.v-cellar .band-body h2 { font-size: clamp(32px, 4.4vw, 58px); max-width: 18ch; line-height: 1.1; }
.v-cellar .band-body p { max-width: 52ch; margin: 20px 0 32px; color: rgba(255,255,255,.75); line-height: 1.7; font-weight: 300; }

.v-cellar .ps { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: stretch; background: #160d0d; }
.v-cellar .ps img { width: 100%; height: 100%; min-height: 340px; object-fit: cover; }
.v-cellar .ps { grid-template-columns: .92fr 1.08fr; }
.v-cellar .ps-body { padding: 64px 54px; display: flex; flex-direction: column; justify-content: center; }
.v-cellar .ps-body h2 { font-size: clamp(28px, 2.7vw, 39px); margin-top: 14px; white-space: nowrap; }
.v-cellar .ps-body p { color: rgba(255,255,255,.62); line-height: 1.75; margin: 18px 0 30px; font-weight: 300; }

.v-cellar .visit { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
.v-cellar .visit iframe {
  width: 100%; height: 430px; border: 0; border-radius: 2px; background: #2a1c1c;
  filter: saturate(.72) contrast(.94) brightness(.94);
  box-shadow: 0 0 0 1px rgba(201,151,58,.24);
}
.v-cellar .mini { list-style: none; padding: 0; margin: 26px 0 0; }
.v-cellar .mini li {
  position: relative; padding: 11px 0 11px 22px; font-size: 15px; font-weight: 300;
  color: rgba(255,255,255,.72); border-bottom: 1px solid rgba(255,255,255,.08);
}
.v-cellar .mini li::before { content: ''; position: absolute; left: 0; top: 19px; width: 8px; height: 1px; background: var(--gold); }
.v-cellar .hours { list-style: none; padding: 0; margin: 28px 0 0; }

.v-cellar .addr { margin: 30px 0 0; font-size: 16px; line-height: 1.85; color: rgba(255,255,255,.8); }
.v-cellar .addr a { color: var(--gold-light); border-bottom: 1px solid rgba(232,201,122,.35); }
.v-cellar .note { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,.4); font-style: italic; }

/* REVIEWS — design A: editorial pull-quote, one hero quote + two supporting */
.v-cellar .g-badge { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: rgba(255,255,255,.62); }
.v-cellar .g-badge b { color: #fff; font-weight: 600; }
.v-cellar .stars { color: var(--gold); letter-spacing: 2px; }
.v-cellar .rev-hero { display: grid; grid-template-columns: 1fr .62fr; gap: 54px; align-items: center; }
.v-cellar .rev-hero blockquote { margin: 0; }
.v-cellar .rev-hero q {
  display: block; quotes: none; font-family: 'Playfair Display', serif; font-style: italic;
  font-size: clamp(23px, 2.5vw, 33px); line-height: 1.42; color: #f6ece7;
}
.v-cellar .rev-by { display: flex; align-items: center; gap: 14px; margin-top: 28px; }
.v-cellar .rev-by img, .v-cellar .rev-ini {
  width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex: 0 0 46px;
  background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 17px;
}
.v-cellar .rev-by b { display: block; font-size: 15px; font-weight: 600; }
.v-cellar .rev-by span { display: block; font-size: 12.5px; color: rgba(255,255,255,.48); margin-top: 3px; }
.v-cellar .rev-shot { border-radius: 3px; overflow: hidden; }
.v-cellar .rev-shot img { width: 100%; height: 420px; object-fit: cover; }
.v-cellar .rev-shot figcaption { font-size: 11.5px; color: rgba(255,255,255,.42); padding: 12px 2px 0; }

}

.v-cellar .rev-sm {

}
.v-cellar .rev-sm:hover { border-color: rgba(201,151,58,.42); transform: translateY(-3px); }
.v-cellar .rev-sm q { display: block; quotes: none; font-size: 15.5px; line-height: 1.75; color: rgba(255,255,255,.82); font-weight: 300; margin-top: 12px; }
.v-cellar .rev-sm .rev-by { margin-top: 22px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.08); }

.v-cellar .foot { background: #120a0a; border-top: 1px solid rgba(201,151,58,.18); padding: 62px 0 34px; }
.v-cellar .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; }
.v-cellar .foot img { width: 150px; margin-bottom: 20px; }
.v-cellar .foot h4 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 18px; }
.v-cellar .foot ul { list-style: none; padding: 0; margin: 0; }
.v-cellar .foot li { margin-bottom: 11px; }
.v-cellar .foot a { font-size: 14px; color: rgba(255,255,255,.6); transition: color 160ms ease-out; }
.v-cellar .foot a:hover { color: var(--gold-light); }
.v-cellar .foot-base { margin-top: 46px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.07); font-size: 12px; color: rgba(255,255,255,.34); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  .v-cellar .nav-links { display: none; }

/* ============================================================
   VARIANT 2 — PATIO
   Axis: light, editorial, lifestyle-led. Daytime experience.
   ============================================================ */
.v-patio { background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; }
.v-patio .wrap { max-width: 1200px; margin: 0 auto; padding: 0 34px; }
.v-patio h1, .v-patio h2, .v-patio h3 { font-family: 'Playfair Display', serif; font-weight: 400; margin: 0; letter-spacing: -.015em; }
.v-patio .eyebrow { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--wine); font-weight: 600; }

.v-patio .nav {
  display: flex; align-items: center; justify-content: space-between;
  max-width: 1200px; margin: 0 auto; padding: 24px 34px;
}
.v-patio .nav img { width: 132px; }
.v-patio .nav-links { display: flex; gap: 28px; align-items: center; font-size: 14px; }
.v-patio .nav-links a { color: var(--ink); position: relative; padding-bottom: 3px; }
.v-patio .nav-links a::after {
  content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%;
  background: var(--wine); transform: scaleX(0); transform-origin: left;
  transition: transform 200ms var(--ease);
}
.v-patio .nav-links a:hover::after { transform: scaleX(1); }
.v-patio .nav-cta {
  background: var(--wine); color: #fff; padding: 12px 24px; border-radius: 999px;
  font-size: 13px; font-weight: 600; transition: background 180ms ease-out, transform 180ms var(--ease);
}
.v-patio .nav-cta:hover { background: var(--wine-mid); transform: translateY(-1px); }

.v-patio .hero { padding: 40px 0 0; position: relative; overflow: hidden; }
.v-patio .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: center; position: relative; z-index: 2; }

/* MORPHING — the hero mask and the blob behind the type are real SVG path
   interpolations, not fades. Shapes share an identical command sequence so the
   browser can tween between them. */
.v-patio .morph-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.v-patio .hero-blob {
  position: absolute; z-index: 1; pointer-events: none;
  left: -13%; top: -18%; width: 62%; max-width: 640px; aspect-ratio: 1;
  opacity: .5;
}
.v-patio .hero-blob svg { width: 100%; height: 100%; display: block; }
.v-patio .blob-2 {
  left: auto; right: -16%; top: auto; bottom: -34%; width: 42%;
  opacity: .34;
}
.v-patio .hero-copy { padding-right: 60px; }
.v-patio .hero-copy h1 { font-size: clamp(42px, 5.2vw, 74px); line-height: 1.05; margin: 20px 0 0; }
.v-patio .hero-copy h1 em { font-style: italic; color: var(--wine); }
.v-patio .hero-copy p { font-size: 18px; line-height: 1.7; color: var(--mid); margin: 24px 0 0; max-width: 40ch; }
.v-patio .hero-actions { display: flex; gap: 14px; margin-top: 34px; flex-wrap: wrap; }
.v-patio .btn-wine {
  background: var(--wine); color: #fff; padding: 15px 30px; border-radius: 999px;
  font-size: 14px; font-weight: 600; transition: background 180ms ease-out, transform 180ms var(--ease);
}
.v-patio .btn-wine:hover { background: var(--wine-mid); transform: translateY(-2px); }
/* Secondary button: solid dark, never white-on-cream, so it reads as clickable. */
.v-patio .btn-line {
  background: var(--ink); border: 1px solid var(--ink); color: var(--cream);
  padding: 15px 30px; border-radius: 999px; font-size: 14px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(46,26,26,.16);
  transition: background 180ms ease-out, border-color 180ms ease-out, transform 180ms var(--ease);
}
.v-patio .btn-line:hover { background: #45292a; border-color: #45292a; transform: translateY(-2px); }
.v-patio .btn-wine:active, .v-patio .btn-line:active { transform: translateY(0); }

/* Frame carries the arch clip so the badge can overhang without being cut off.
   The radius is the no-SVG fallback; the morphing clipPath overrides it. */
.v-patio .hero-media { position: relative; }
.v-patio .hero-frame { border-radius: 260px 260px 8px 8px; overflow: hidden; }
.v-patio .hero-frame[data-morph] { border-radius: 0; clip-path: url(#sjwArch); }
.v-patio .hero-media img { width: 100%; height: 640px; object-fit: cover; object-position: center 40%; }
.v-patio .hero-badge {
  position: absolute; left: -34px; bottom: 54px; background: var(--cream);
  border: 1px solid var(--taupe); border-radius: 999px; padding: 16px 26px;
  font-family: 'Playfair Display', serif; font-size: 15px; color: var(--wine);
  box-shadow: 0 12px 30px rgba(46,26,26,.09);
}

.v-patio .marq { background: var(--wine); color: var(--gold-pale); overflow: hidden; padding: 15px 0; margin-top: 70px; }
.v-patio .marq-track { display: flex; gap: 54px; white-space: nowrap; animation: marq 34s linear infinite; }
.v-patio .marq span { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; }
@keyframes marq { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.v-patio .sec { padding: 100px 0; }
.v-patio .sec-head { max-width: 640px; margin: 0 auto 56px; text-align: center; }
.v-patio .sec-head h2 { font-size: clamp(30px, 3.4vw, 46px); line-height: 1.15; margin-top: 14px; }
.v-patio .sec-head p { color: var(--mid); font-size: 16px; line-height: 1.75; margin: 16px 0 0; }

.v-patio .story { display: grid; grid-template-columns: 1fr 1.1fr; gap: 70px; align-items: center; }
.v-patio .story img { width: 100%; height: 500px; object-fit: cover; border-radius: 8px; }
.v-patio .story h2 { font-size: clamp(30px, 3.4vw, 46px); line-height: 1.15; margin-top: 14px; }
.v-patio .story p { color: var(--mid); line-height: 1.8; margin: 20px 0 0; font-size: 16px; }

.v-patio .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.v-patio .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 14px rgba(46,26,26,.06); transition: transform 240ms var(--ease), box-shadow 240ms ease-out; }
.v-patio .card:hover { transform: translateY(-6px); box-shadow: 0 18px 38px rgba(46,26,26,.12); }
.v-patio .card img { width: 100%; height: 250px; object-fit: cover; }
.v-patio .card-body { padding: 28px 28px 32px; }
.v-patio .card-body h3 { font-size: 23px; }
.v-patio .card-body p { color: var(--mid); font-size: 14.5px; line-height: 1.7; margin: 11px 0 18px; }
.v-patio .card-link { font-size: 13px; font-weight: 600; color: var(--wine); letter-spacing: .04em; }
.v-patio .card-link::after { content: ' \2192'; display: inline-block; transition: transform 200ms var(--ease); }
.v-patio .card:hover .card-link::after { transform: translateX(4px); }

.v-patio .mason { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-auto-rows: 218px; gap: 20px; }
.v-patio .mason figure { margin: 0; overflow: hidden; border-radius: 8px; position: relative; }
.v-patio .mason img { width: 100%; height: 100%; object-fit: cover; transition: transform 520ms var(--ease); }
.v-patio .mason figure:hover img { transform: scale(1.05); }
.v-patio .m-a { grid-row: span 2; }
.v-patio .m-b { grid-column: span 2; }
.v-patio .mason figcaption {
  position: absolute; left: 20px; bottom: 18px; background: rgba(250,246,242,.94);
  padding: 8px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--ink);
}

.v-patio .drinks { display: grid; grid-template-columns: .88fr 1.12fr; align-items: stretch; border-radius: 10px; overflow: hidden; }
.v-patio .drinks img { width: 100%; height: 100%; min-height: 420px; object-fit: cover; }
.v-patio .drinks-body { background: #fff; padding: 60px 54px; display: flex; flex-direction: column; justify-content: center; }
.v-patio .drinks-body h2 { font-size: 40px; margin-top: 14px; }
.v-patio .drinks-body p { color: var(--mid); line-height: 1.8; margin: 18px 0 0; }
.v-patio .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
.v-patio .chip {
  border: 1px solid var(--taupe); border-radius: 999px; padding: 8px 15px;
  font-size: 12.5px; color: var(--ink); white-space: nowrap;
}

.v-patio .gift { position: relative; height: 460px; border-radius: 10px; overflow: hidden; }
.v-patio .gift img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 40%; }
.v-patio .gift::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(30,18,18,.82) 0%, rgba(30,18,18,.28) 70%); }
.v-patio .gift-body { position: relative; z-index: 4; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 60px; max-width: 620px; color: #fff; }
.v-patio .gift-body h2 { font-size: 42px; margin-top: 14px; }
.v-patio .gift-body p { color: rgba(255,255,255,.82); line-height: 1.75; margin: 16px 0 28px; }
.v-patio .gift-body .eyebrow { color: var(--gold-light); }
.v-patio .btn-cream { background: var(--cream); color: var(--ink); padding: 14px 28px; border-radius: 999px; font-size: 14px; font-weight: 600; align-self: flex-start; transition: transform 180ms var(--ease); }
.v-patio .btn-cream:hover { transform: translateY(-2px); }

/* REVIEWS — design B: photo cards with the guest's own shot and an overlapping avatar */
/* stretch + flex + a line clamp, so all three cards are one height regardless of
   how long the review is. */
.v-patio .revs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; align-items: stretch; }
.v-patio .rev {
  background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(46,26,26,.07);
  overflow: hidden; transition: transform 240ms var(--ease), box-shadow 240ms ease-out;
  display: flex; flex-direction: column;
}
.v-patio .rev:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(46,26,26,.13); }
.v-patio .rev-photo { height: 190px; overflow: hidden; background: var(--taupe); }
.v-patio .rev-photo img { width: 100%; height: 100%; object-fit: cover; }
/* Reviewers without a photo get a tinted panel so the row keeps one height. */
.v-patio .rev-photo-alt {
  background: linear-gradient(135deg, var(--wine) 0%, var(--wine-deep) 100%);
  display: flex; align-items: center; justify-content: center;
}
.v-patio .rev-photo-alt span {
  font-family: 'Playfair Display', serif; font-size: 92px; line-height: 1;
  color: rgba(255,255,255,.28); margin-top: 26px;
}
.v-patio .rev-inner { padding: 0 28px 30px; position: relative; flex: 1; display: flex; flex-direction: column; }
.v-patio .rev-face {
  width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
  border: 3px solid #fff; margin-top: -28px; position: relative; z-index: 2;
  background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 20px;
}
.v-patio .rev-noPhoto { padding-top: 30px; }
.v-patio .rev-name { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
.v-patio .rev-name b { font-size: 15.5px; font-weight: 600; }
.v-patio .rev .stars { color: var(--gold); letter-spacing: 2px; font-size: 14px; display: block; margin-top: 10px; }
.v-patio .rev q {
  quotes: none; font-family: 'Playfair Display', serif; font-size: 17.5px;
  line-height: 1.58; margin: 14px 0 0; color: var(--ink);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;
}
/* margin-top:auto pins the date to the bottom edge of every card */
.v-patio .rev cite { display: block; font-style: normal; font-size: 12.5px; color: var(--mid); margin-top: auto; padding-top: 18px; }
.v-patio .g-badge { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; color: var(--mid); margin-top: 14px; }
.v-patio .g-badge b { color: var(--ink); font-weight: 700; }

.v-patio .visit { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
.v-patio .visit img { width: 100%; height: 420px; object-fit: cover; border-radius: 10px; }
.v-patio .hours { list-style: none; padding: 0; margin: 24px 0 0; }
.v-patio .hours li { display: flex; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--taupe); font-size: 15px; }
.v-patio .hours li span:first-child { color: var(--mid); }
.v-patio .addr { margin: 26px 0 0; line-height: 1.85; font-size: 16px; }
/* Address sits directly under the heading, above the day rows. */
.v-patio .addr-lead { margin: 16px 0 22px; }
.v-patio .addr-lead a { display: inline-block; margin-top: 2px; }
.v-patio .addr a { color: var(--wine); font-weight: 600; border-bottom: 1px solid rgba(156,36,38,.3); }
.v-patio .note { margin-top: 14px; font-size: 12px; color: var(--mid); font-style: italic; }
.v-patio iframe { width: 100%; height: 340px; border: 0; border-radius: 10px; margin-top: 40px; }

.v-patio .foot { background: var(--charcoal); color: #efe3dd; padding: 62px 0 32px; }
.v-patio .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; }
.v-patio .foot img { width: 150px; margin-bottom: 20px; }
.v-patio .foot h4 { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 0 0 18px; }
.v-patio .foot ul { list-style: none; padding: 0; margin: 0; }
.v-patio .foot li { margin-bottom: 11px; }
.v-patio .foot a { font-size: 14px; color: rgba(255,255,255,.6); }
.v-patio .foot a:hover { color: var(--gold-light); }
.v-patio .foot-base { margin-top: 46px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; color: rgba(255,255,255,.34); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

@media (max-width: 900px) {
  .v-patio .nav-links { display: none; }
  .v-patio .hero-grid, .v-patio .story, .v-patio .drinks, .v-patio .visit { grid-template-columns: 1fr; gap: 34px; }
  .v-patio .hero-copy { padding-right: 0; }
  .v-patio .hero-frame { border-radius: 8px; }
  .v-patio .hero-media img { height: 380px; }
  .v-patio .hero-badge { left: 16px; bottom: 16px; }
  .v-patio .cards, .v-patio .revs { grid-template-columns: 1fr; }
  .v-patio .mason { grid-template-columns: 1fr 1fr; grid-auto-rows: 170px; }
  .v-patio .drinks-body, .v-patio .gift-body { padding: 40px 28px; }
  .v-patio .foot-grid { grid-template-columns: 1fr 1fr; }
}

/* ============================================================
   VARIANT 3 — MARQUEE
   Axis: utility first, dense. Built for a visitor planning today.
   ============================================================ */
.v-marquee { background: #fff; color: #17100f; font-family: 'Inter', sans-serif; }
.v-marquee .wrap { max-width: 1260px; margin: 0 auto; padding: 0 30px; }
.v-marquee h1, .v-marquee h2, .v-marquee h3 { margin: 0; font-weight: 800; letter-spacing: -.03em; }
.v-marquee .serif { font-family: 'Playfair Display', serif; font-weight: 400; letter-spacing: -.01em; }

.v-marquee .util {
  background: var(--charcoal); color: rgba(255,255,255,.78); font-size: 13px;
}
.v-marquee .util-inner { max-width: 1260px; margin: 0 auto; padding: 9px 30px; display: flex; justify-content: space-between; align-items: center; gap: 18px; flex-wrap: wrap; }
.v-marquee .util a { color: #fff; font-weight: 600; }
.v-marquee .util-left { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.v-marquee .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.v-marquee .dot-open { background: #4ea768; box-shadow: 0 0 0 0 rgba(78,167,104,.7); animation: pulse 2.6s ease-out infinite; }
.v-marquee .dot-shut { background: #b8564f; }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(78,167,104,0); } 100% { box-shadow: 0 0 0 0 rgba(78,167,104,0); } }

.v-marquee .nav { border-bottom: 1px solid #eae1db; background: #fff; }
.v-marquee .nav-inner { max-width: 1260px; margin: 0 auto; padding: 16px 30px; display: flex; align-items: center; justify-content: space-between; }
.v-marquee .nav img { width: 124px; }
.v-marquee .nav-links { display: flex; gap: 26px; font-size: 14px; font-weight: 500; }
.v-marquee .nav-links a:hover { color: var(--wine); }
.v-marquee .nav-cta { background: var(--wine); color: #fff; padding: 11px 20px; border-radius: 4px; font-size: 13.5px; font-weight: 700; transition: background 170ms ease-out; }
.v-marquee .nav-cta:hover { background: var(--wine-mid); }

.v-marquee .hero { display: grid; grid-template-columns: 1.02fr .98fr; min-height: 560px; }
.v-marquee .hero-media { position: relative; overflow: hidden; }
.v-marquee .hero-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.v-marquee .hero-panel { background: var(--wine); color: #fff; padding: 68px 60px; display: flex; flex-direction: column; justify-content: center; }
/* max-width: none, or the `.hero-panel > p` rule below clamps this to 42ch and
   wraps "Gift Shop" onto a second line. */
.v-marquee .hero-panel .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-light); max-width: none; }
.v-marquee .hero-panel h1 { font-size: clamp(36px, 4.1vw, 56px); line-height: 1.06; margin: 18px 0 0; }
.v-marquee .hero-panel > p { font-size: 16.5px; line-height: 1.65; color: rgba(255,255,255,.85); margin: 20px 0 0; max-width: 42ch; }
.v-marquee .hero-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 34px; max-width: 460px; }
.v-marquee .hb {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.26); color: #fff;
  padding: 15px 18px; border-radius: 5px; font-size: 14px; font-weight: 600;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  transition: background 170ms ease-out, transform 170ms var(--ease);
}
/* No button carries the gold at rest. All four are identical until pointed at,
   and the gold appears only under the pointer. */
.v-marquee .hero-btns .hb:hover {
  background: var(--gold); border-color: var(--gold); color: #2a1706;
  transform: translateY(-3px);
  box-shadow: 0 0 0 3px rgba(255,255,255,.34), 0 12px 26px rgba(0,0,0,.3);
}
.v-marquee .hero-btns .hb:hover small { color: #2a1706; opacity: .75; }
.v-marquee .hb:active, .v-marquee .hb-solid:active { transform: translateY(0); }
.v-marquee .hb small { display: block; font-size: 11.5px; font-weight: 500; opacity: .72; margin-top: 3px; }

.v-marquee .strip { background: var(--charcoal); color: #fff; }
.v-marquee .strip-inner { max-width: 1260px; margin: 0 auto; padding: 0 30px; display: grid; grid-template-columns: repeat(4, 1fr); }
.v-marquee .strip-cell { padding: 26px 20px; border-right: 1px solid rgba(255,255,255,.1); }
.v-marquee .strip-cell:last-child { border-right: 0; }
.v-marquee .strip-cell b { display: block; font-size: 15px; font-weight: 700; }
.v-marquee .strip-cell span { display: block; font-size: 12.5px; color: rgba(255,255,255,.55); margin-top: 5px; }

.v-marquee .sec { padding: 82px 0; }
.v-marquee .sec-tight { padding: 62px 0; }
/* Three columns so the middle of the row is never empty. */
.v-marquee .sec-head {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 46px;
  margin-bottom: 32px; padding-bottom: 22px; border-bottom: 1px solid #eae1db;
}
.v-marquee .sec-head h2 { font-size: clamp(27px, 3vw, 38px); line-height: 1.14; }
.v-marquee .sec-head p { color: #7a6a66; font-size: 15px; margin: 0 0 4px; line-height: 1.65; }
/* Was a bare text link; now a real button. */
.v-marquee .see-all {
  font-size: 13.5px; font-weight: 700; color: var(--wine); white-space: nowrap;
  border: 1.5px solid var(--wine); border-radius: 999px; padding: 11px 20px;
  transition: background 170ms ease-out, color 170ms ease-out, transform 170ms var(--ease);
}
.v-marquee .see-all:hover { background: var(--wine); color: #fff; transform: translateY(-2px); }
.v-marquee .see-all-solid { background: var(--wine); color: #fff; }
.v-marquee .see-all-solid:hover { background: var(--wine-deep); border-color: var(--wine-deep); }

.v-marquee .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.v-marquee .act {
  border: 1px solid #eae1db; border-radius: 8px; overflow: hidden; background: #fff;
  display: flex; flex-direction: column;
  transition: border-color 180ms ease-out, transform 180ms var(--ease), box-shadow 180ms ease-out;
}
.v-marquee .act:hover { border-color: var(--wine); transform: translateY(-3px); box-shadow: 0 12px 26px rgba(23,16,15,.09); }
.v-marquee .act img { width: 100%; height: 168px; object-fit: cover; }
.v-marquee .act-body { padding: 20px 22px 24px; flex: 1; display: flex; flex-direction: column; }
.v-marquee .act-body h3 { font-size: 18px; letter-spacing: -.02em; }
.v-marquee .act-body p { font-size: 14px; color: #7a6a66; line-height: 1.6; margin: 8px 0 16px; flex: 1; }
.v-marquee .act-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--wine); }
.v-marquee .tag { display: inline-block; background: var(--gold-pale); color: #7a5a1c; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 5px 10px; border-radius: 3px; }

.v-marquee .lineup { background: var(--cream); }
.v-marquee .wines { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.v-marquee .wine {
  display: block; background: #fff; border: 1px solid #eae1db; border-radius: 8px;
  overflow: hidden; text-align: center;
  transition: transform 180ms var(--ease), border-color 180ms ease-out, box-shadow 180ms ease-out;
}
.v-marquee .wine:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 12px 24px rgba(23,16,15,.1); }
.v-marquee .wine img { width: 100%; height: 172px; object-fit: cover; object-position: center 32%; }
.v-marquee .wine-body { padding: 15px 12px 17px; }
.v-marquee .wine b { display: block; font-size: 13.5px; letter-spacing: -.01em; }
.v-marquee .wine span { display: block; font-size: 11.5px; color: #8a7a76; margin-top: 4px; }
.v-marquee .wine em {
  display: block; font-style: normal; margin-top: 10px; font-size: 11.5px; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase; color: var(--wine);
}
.v-marquee .wines-cta { display: flex; justify-content: center; margin-top: 30px; }
.v-marquee .btn-cta {
  background: var(--wine); color: #fff; border-radius: 999px; padding: 15px 34px;
  font-size: 14.5px; font-weight: 700;
  transition: background 170ms ease-out, transform 170ms var(--ease);
}
.v-marquee .btn-cta:hover { background: var(--wine-deep); transform: translateY(-2px); }

/* REVIEWS — design C: score panel with a rating breakdown beside a dense list */
.v-marquee .rev-wrap { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 46px; align-items: start; }
.v-marquee .rev-panel { border: 1px solid #eae1db; border-radius: 10px; padding: 26px 24px; background: var(--cream); }
.v-marquee .rev-score { display: flex; align-items: baseline; gap: 10px; }
.v-marquee .rev-score b { font-size: 46px; font-weight: 800; letter-spacing: -.04em; color: #17100f; line-height: 1; }
.v-marquee .rev-score .stars { color: var(--gold); font-size: 15px; letter-spacing: 1px; }
.v-marquee .rev-count { font-size: 13px; color: #7a6a66; margin: 10px 0 20px; }
.v-marquee .bar-row { display: grid; grid-template-columns: 12px 1fr 32px; gap: 9px; align-items: center; font-size: 12px; color: #8a7a76; margin-bottom: 7px; }
.v-marquee .bar { height: 6px; border-radius: 999px; background: #e7ddd6; overflow: hidden; }
.v-marquee .bar i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
.v-marquee .rev-src { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #7a6a66; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e7ddd6; }
.v-marquee .revs { display: grid; gap: 0; }
.v-marquee .rev { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 16px; padding: 22px 0; border-bottom: 1px solid #eae1db; align-items: start; }
.v-marquee .rev:first-child { padding-top: 0; }
.v-marquee .rev-face { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--wine); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.v-marquee .rev b { font-size: 14.5px; font-weight: 700; }
.v-marquee .rev .stars { color: var(--gold); letter-spacing: 1px; font-size: 13px; margin-left: 9px; }

/* ---- Morphing hero (Patio) -------------------------------------------------
   Every shape in a set uses the SAME command sequence and the same number of
   points, which is what lets the browser tween `d` smoothly. Change that and the
   morph snaps instead of flowing. Motion is suppressed under reduced-motion. */
var PREFERS_REDUCED = window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Arch mask, authored in objectBoundingBox units so it scales to any image box.
   Sequence for all four: M, L, C, C, L, Z. */
var ARCH_SHAPES = [
  /* tall arch */   'M0,1 L0,0.52 C0,0.14 0.20,0 0.50,0 C0.80,0 1,0.14 1,0.52 L1,1 Z',
  /* low wide  */   'M0,1 L0,0.12 C0,0.02 0.18,0 0.50,0 C0.82,0 1,0.02 1,0.12 L1,1 Z',
  /* leans right */ 'M0,1 L0,0.60 C0,0.18 0.08,0.06 0.44,0.03 C0.84,0 1,0.26 1,0.30 L1,1 Z',
  /* petal     */   'M0,1 L0,0.26 C0,0.02 0.32,0.16 0.58,0.05 C0.84,-0.05 1,0.34 1,0.56 L1,1 Z'
];
/* Liquid blob, viewBox 0 0 200 200. Sequence for all four: M, C, C, C, C, Z. */
var BLOB_SHAPES = [
  'M100,10 C150,10 190,50 190,100 C190,150 150,190 100,190 C50,190 10,150 10,100 C10,50 50,10 100,10 Z',
  'M124,6  C176,26 196,74 176,122 C156,170 118,196 74,180 C30,164 4,124 14,78  C24,32 72,-14 124,6 Z',
  'M78,20  C140,-6 196,34 190,92  C184,150 160,196 96,186 C32,176 4,146 10,90  C16,34 16,46 78,20 Z',
  'M110,4  C168,20 172,72 188,116 C204,160 134,200 88,188 C42,176 28,132 12,92  C-4,52 52,-12 110,4 Z'
];

/* Builds the <animate> that walks the shape list and returns to the start. */
function morphAnim(shapes, dur, offset) {
  if (PREFERS_REDUCED) return '';
  var loop = shapes.concat([shapes[0]]);
  var splines = [];
  for (var i = 0; i < loop.length - 1; i++) splines.push('0.45 0 0.55 1');
  return '<animate attributeName="d" dur="' + dur + 's" repeatCount="indefinite"' +
    ' calcMode="spline" begin="-' + offset + 's"' +
    ' keyTimes="0;0.25;0.5;0.75;1"' +
    ' keySplines="' + splines.join(';') + '"' +
    ' values="' + loop.join(';') + '" />';
}

function patioMorphDefs() {
  return '<svg class="morph-defs" aria-hidden="true" focusable="false">' +
    '<defs>' +
      '<clipPath id="sjwArch" clipPathUnits="objectBoundingBox">' +
        '<path d="' + ARCH_SHAPES[0] + '">' + morphAnim(ARCH_SHAPES, 10, 0) + '</path>' +
      '</clipPath>' +
      '<linearGradient id="sjwBlobA" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#9c2426" stop-opacity=".55" />' +
        '<stop offset="1" stop-color="#c9973a" stop-opacity=".62" />' +
      '</linearGradient>' +
      '<linearGradient id="sjwBlobB" x1="1" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#c9973a" stop-opacity=".58" />' +
        '<stop offset="1" stop-color="#9c2426" stop-opacity=".38" />' +
      '</linearGradient>' +
    '</defs></svg>';
}

function morphBlob(cls, fill, dur, offset) {
  return '<div class="hero-blob ' + cls + '" aria-hidden="true">' +
    '<svg viewBox="0 0 200 200"><path fill="url(#' + fill + ')" d="' + BLOB_SHAPES[0] + '">' +

}

function bar(nStars, count) {
  var total = GOOGLE_HISTOGRAM.reduce(function (a, h) { return a + h[1]; }, 0);
  var pct = Math.round(count / total * 1000) / 10;

}

var replay = picker.querySelector('.proto-picker-replay');
var current = 0;
var observer = null;

function moveHighlight() {
  var el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
}

function bindReveals() {
  if (observer) observer.disconnect();
  var nodes = stage.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    [].forEach.call(nodes, function (n) { n.classList.add('in'); });
    return;
  }
  observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); observer.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
  [].forEach.call(nodes, function (n, i) {
    n.style.transitionDelay = (i % 4) * 55 + 'ms';
    observer.observe(n);
  });
}

function mount(i) {
  stage.innerHTML = '';
  window.scrollTo(0, 0);
  requestAnimationFrame(function () {
    stage.innerHTML = variants[i]();
    bindReveals();
  });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach(function (el, j) {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  /* file:// origins can reject replaceState; never let that break the picker. */
  try {
    var url = new URL(location);
    url.searchParams.set('v', i + 1);
    history.replaceState(null, '', url);
  } catch (err) { /* opening straight off disk, selection just will not persist */ }
  mount(i);
}

items.forEach(function (el, i) { el.addEventListener('click', function () { setActive(i); }); });
if (replay) replay.addEventListener('click', function () { mount(current); });
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(function () {
  requestAnimationFrame(function () { picker.setAttribute('data-ready', ''); });
});
</script>
